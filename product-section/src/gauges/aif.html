<svg viewBox="0 0 122 25" role="img" aria-labelledby="aif-gauge-t">
  <title id="aif-gauge-t">The order in which an AIF shares out money: your capital first, then the hurdle return set in the fund’s terms, if the fund earns it, then a catch-up for the manager in some funds, then the remaining profit, often 80 to you and 20 to the manager.</title>
  <rect x="0" y="0.6" width="29.75" height="4.6" class="f-job"/>
  <text x="1.8" y="3.85" class="t-sm b t-white">1  Capital back</text>
  <text x="0" y="9.4" class="t-sm">All your capital comes</text>
  <text x="0" y="12.6" class="t-sm">back to you first.</text>

  <rect x="30.75" y="4.6" width="29.75" height="4.6" class="f-job" style="opacity:.72"/>
  <text x="32.55" y="7.85" class="t-sm b t-white">2  Hurdle</text>
  <text x="30.75" y="13.4" class="t-sm">Then the hurdle: a return</text>
  <text x="30.75" y="16.6" class="t-sm">set in the fund’s terms,</text>
  <text x="30.75" y="19.8" class="t-sm">if the fund earns it.</text>

  <rect x="61.5" y="8.6" width="29.75" height="4.6" class="f-job" style="opacity:.45"/>
  <text x="63.3" y="11.85" class="t-sm b">3  Catch-up</text>
  <text x="61.5" y="17.4" class="t-sm">Then the manager catches</text>
  <text x="61.5" y="20.6" class="t-sm">up, in some funds only.</text>

  <rect x="92.25" y="12.6" width="29.75" height="4.6" class="f-tint s-job hair"/>
  <text x="94.05" y="15.85" class="t-sm b">4  The rest is split</text>
  <text x="92.25" y="21.4" class="t-sm">often 80% to you,</text>
  <text x="92.25" y="24.6" class="t-sm">20% to the manager.</text>
</svg>
