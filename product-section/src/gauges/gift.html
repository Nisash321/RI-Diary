<svg viewBox="0 0 122 25.4" role="img" aria-labelledby="gift-gauge-t">
  <title id="gift-gauge-t">The same investment held in US dollars is worth more in rupees if the rupee weakens, and less if the rupee strengthens.</title>
  <defs>
    <marker id="ah-gift" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" class="f-ink3"/>
    </marker>
  </defs>
  <rect x="0" y="2.2" width="35" height="15.8" class="f-panel"/>
  <text x="2.4" y="8.4" class="t-sm b">Your investment,</text>
  <text x="2.4" y="11.6" class="t-sm b">held in US dollars</text>
  <text x="2.4" y="14.8" class="t-sm">the same in both cases</text>

  <text x="57" y="5.6" class="t-sm mid">If the rupee weakens</text>
  <line x1="36.6" y1="7.4" x2="77.4" y2="7.4" class="s-ink3 thin" marker-end="url(#ah-gift)"/>
  <text x="57" y="14.2" class="t-sm mid">If the rupee strengthens</text>
  <line x1="36.6" y1="16" x2="77.4" y2="16" class="s-ink3 thin" marker-end="url(#ah-gift)"/>

  <rect x="79" y="3.6" width="43" height="7.6" class="f-job"/>
  <path d="M82.2,8.9 L84.2,5.9 L86.2,8.9 Z" class="f-paper"/>
  <text x="88.4" y="8.5" class="t-sm b t-white">Worth more in rupees</text>
  <rect x="79" y="12.2" width="43" height="7.6" class="f-tint s-job hair"/>
  <path d="M82.2,14.5 L86.2,14.5 L84.2,17.5 Z" class="f-job"/>
  <text x="88.4" y="17.1" class="t-sm b">Worth less in rupees</text>

  <text x="0" y="24.4" class="t-sm t-ink3">Same investment, same day. Only the exchange rate differs, and it can work either way.</text>
</svg>
