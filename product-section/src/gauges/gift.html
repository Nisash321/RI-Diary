<svg viewBox="0 0 122 25.4" role="img" aria-labelledby="gift-gauge-t">
  <title id="gift-gauge-t">A fund that returns 8% in US dollars returns about 11% in rupees if the rupee weakens 3%, and about 5% if it strengthens 3%.</title>
  <text x="50" y="4.5" class="t-sm end">Fund return in US dollars</text>
  <rect x="52" y="1.4" width="32" height="4.4" class="f-ink3"/>
  <text x="85.4" y="4.5" class="t-sm b t-num">+8%</text>

  <text x="50" y="11.3" class="t-sm end">In rupees, if the rupee weakens 3%</text>
  <rect x="52" y="8.2" width="44.96" height="4.4" class="f-job"/>
  <text x="98.4" y="11.3" class="t-sm b t-num">about +11%</text>

  <text x="50" y="18.1" class="t-sm end">In rupees, if the rupee strengthens 3%</text>
  <rect x="52" y="15" width="19.04" height="4.4" class="f-tint s-job hair"/>
  <text x="72.5" y="18.1" class="t-sm b t-num">about +5%</text>

  <line x1="52" y1="0.6" x2="52" y2="20.2" class="s-ink thin"/>
  <text x="0" y="24.4" class="t-sm t-ink3">Same fund, same year. Only the exchange rate differs.</text>
</svg>
