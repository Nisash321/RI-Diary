<svg viewBox="0 0 122 28.8" role="img" aria-labelledby="sif-gauge-t">
  <title id="sif-gauge-t">Base tax rates on gains for the highest tax slab: 12.5% for an equity-oriented SIF held over 12 months, paid only when you redeem or switch; up to 30% on derivative profits in a PMS, paid every year; 30% in a Category III AIF, paid by the fund every year. Surcharge and cess are added to all three, least for the SIF.</title>
  <text x="31" y="2.4" class="t-cap">Tax on gains</text>
  <text x="122" y="2.4" class="t-cap end">When it is paid</text>

  <text x="0" y="6.9" class="t-sm b t-job">SIF</text>
  <text x="0" y="9.6" class="t-sm" style="font-size:1.95px">held over 12 months</text>
  <rect x="31" y="4.4" width="13.9" height="4.6" class="f-job"/>
  <text x="46.1" y="7.75" class="t-sm b t-num">12.5%</text>
  <text x="122" y="7.75" class="t-sm b end t-job">Only when you redeem or switch</text>

  <text x="0" y="13.3" class="t-sm b">PMS</text>
  <text x="0" y="16" class="t-sm" style="font-size:1.95px">profit from derivatives</text>
  <rect x="31" y="10.8" width="33.3" height="4.6" class="f-ink3"/>
  <text x="63" y="14.15" class="t-sm b end t-white t-num">up to 30%</text>
  <text x="122" y="14.15" class="t-sm end">Every year, on every trade</text>

  <text x="0" y="19.7" class="t-sm b">Category III AIF</text>
  <text x="0" y="22.4" class="t-sm" style="font-size:1.95px">long-short fund</text>
  <rect x="31" y="17.2" width="33.3" height="4.6" class="f-ink2"/>
  <text x="63" y="20.55" class="t-sm b end t-white t-num">30%</text>
  <text x="122" y="20.55" class="t-sm end">Every year, inside the fund</text>

  <text x="0" y="25.6" class="t-sm t-ink3" style="font-size:1.95px">Base rates, top tax slab, FY 2026-27. Surcharge and 4% cess are added to all three; the surcharge is lowest for the SIF. SIF: equity-oriented;</text>
