<svg viewBox="0 0 122 28.6" role="img" aria-labelledby="sif-gauge-t">
  <title id="sif-gauge-t">Highest-bracket tax on gains: about 15% for an equity-oriented SIF held over a year, paid only when you redeem; up to 39% on derivative profits in a PMS, paid every year; about 42.7% in a Category III AIF, paid inside the fund every year.</title>
  <text x="31" y="2.4" class="t-cap">Tax on gains</text>
  <text x="122" y="2.4" class="t-cap end">When it is paid</text>

  <text x="0" y="6.9" class="t-sm b t-job">SIF</text>
  <text x="0" y="9.6" class="t-sm" style="font-size:1.95px">equity-oriented, 1 yr+</text>
  <rect x="31" y="4.4" width="16.6" height="4.6" class="f-job"/>
  <text x="48.8" y="7.75" class="t-sm b t-num">about 15%</text>
  <text x="122" y="7.75" class="t-sm b end t-job">Only when you redeem</text>

  <text x="0" y="13.3" class="t-sm b">PMS</text>
  <text x="0" y="16" class="t-sm" style="font-size:1.95px">profit from derivatives</text>
  <rect x="31" y="10.8" width="43.3" height="4.6" class="f-ink3"/>
  <text x="73" y="14.15" class="t-sm b end t-white t-num">up to 39%</text>
  <text x="122" y="14.15" class="t-sm end">Every year, trade by trade</text>

  <text x="0" y="19.7" class="t-sm b">Category III AIF</text>
  <text x="0" y="22.4" class="t-sm" style="font-size:1.95px">long-short fund</text>
  <rect x="31" y="17.2" width="47.4" height="4.6" class="f-ink2"/>
  <text x="77.1" y="20.55" class="t-sm b end t-white t-num">about 42.7%</text>
  <text x="122" y="20.55" class="t-sm end">Inside the fund, every year</text>

  <text x="0" y="25.6" class="t-sm t-ink3" style="font-size:1.95px">Highest bracket, with surcharge and cess. SIF: 12.5% on long-term gains above ₹1.25 lakh a year (20% within a year). PMS: share sales are taxed as</text>
  <text x="0" y="28.2" class="t-sm t-ink3" style="font-size:1.95px">capital gains, derivative profits as business income at your slab. AIF: taxed in the fund at the maximum marginal rate. FY 2026-27 rules.</text>
</svg>
