<svg viewBox="0 0 122 80" role="img" aria-labelledby="aif-plate-t">
  <title id="aif-plate-t">Phases of a closed-ended AIF over eight years with an illustrative J-curve of net cash, and the three SEBI categories.</title>

  <!-- Phases -->
  <rect x="12" y="1" width="40.5" height="4.4" class="f-job"/>
  <text x="13.6" y="4.1" class="t-cap t-white">Capital calls</text>
  <rect x="25.5" y="6.4" width="54" height="4.4" class="f-job" style="opacity:.6"/>
  <text x="27.1" y="9.5" class="t-cap t-white">Investing</text>
  <rect x="66" y="11.8" width="54" height="4.4" class="f-deep"/>
  <text x="67.6" y="14.9" class="t-cap t-white">Exits and payouts</text>
  <text x="0" y="4.1" class="t-cap job">Phase</text>

  <!-- J-curve -->
  <line x1="12" y1="33" x2="120" y2="33" class="s-ink3 hair dash"/>
  <text x="10.6" y="33.8" class="t-sm end">0</text>
  <path d="M12,33 C24,39 38,43.5 52.5,42.5 C66,41.5 72,37.5 82,33 C94,27.5 106,24 120,22" class="f-none s-job" style="stroke-width:.85"/>
  <circle cx="120" cy="22" r=".9" class="f-job"/>
  <text x="120" y="19.8" class="t-sm b end t-job">Your net cash position</text>
  <text x="22" y="46.6" class="t-sm t-ink3">Money out: capital called, fees paid</text>
  <text x="84.5" y="37.6" class="t-sm t-job">Money back, if investments do well</text>

  <!-- Year axis -->
  <line x1="12" y1="49.4" x2="120" y2="49.4" class="s-ink thin"/>
  <g class="t-num">
    <line x1="12" y1="48.6" x2="12" y2="50.2" class="s-ink thin"/><text x="12" y="52.8" class="t-sm mid">0</text>
    <line x1="25.5" y1="48.6" x2="25.5" y2="50.2" class="s-ink thin"/><text x="25.5" y="52.8" class="t-sm mid">1</text>
    <line x1="39" y1="48.6" x2="39" y2="50.2" class="s-ink thin"/><text x="39" y="52.8" class="t-sm mid">2</text>
    <line x1="52.5" y1="48.6" x2="52.5" y2="50.2" class="s-ink thin"/><text x="52.5" y="52.8" class="t-sm mid">3</text>
    <line x1="66" y1="48.6" x2="66" y2="50.2" class="s-ink thin"/><text x="66" y="52.8" class="t-sm mid">4</text>
    <line x1="79.5" y1="48.6" x2="79.5" y2="50.2" class="s-ink thin"/><text x="79.5" y="52.8" class="t-sm mid">5</text>
    <line x1="93" y1="48.6" x2="93" y2="50.2" class="s-ink thin"/><text x="93" y="52.8" class="t-sm mid">6</text>
    <line x1="106.5" y1="48.6" x2="106.5" y2="50.2" class="s-ink thin"/><text x="106.5" y="52.8" class="t-sm mid">7</text>
    <line x1="120" y1="48.6" x2="120" y2="50.2" class="s-ink thin"/><text x="120" y="52.8" class="t-sm mid">8</text>
  </g>
  <text x="0" y="52.8" class="t-cap">Year</text>
  <text x="0" y="57.4" class="t-sm t-ink3">Illustrative. Timelines and outcomes differ from fund to fund.</text>

  <!-- Categories -->
  <rect x="0" y="60.6" width="38" height="18.6" class="f-tint"/>
  <text x="2" y="64.8" class="t-cap job">Category I</text>
  <text x="2" y="68.8" class="t-sm">Start-ups, SMEs,</text>
  <text x="2" y="72.1" class="t-sm">infrastructure and</text>
  <text x="2" y="75.4" class="t-sm">social impact</text>

  <rect x="42" y="60.6" width="38" height="18.6" class="f-tint"/>
  <text x="44" y="64.8" class="t-cap job">Category II</text>
  <text x="44" y="68.8" class="t-sm">Private equity, private</text>
  <text x="44" y="72.1" class="t-sm">credit, real estate. No</text>
  <text x="44" y="75.4" class="t-sm">borrowing to invest.</text>

  <rect x="84" y="60.6" width="38" height="18.6" class="f-tint"/>
  <text x="86" y="64.8" class="t-cap job">Category III</text>
  <text x="86" y="68.8" class="t-sm">Hedge-fund-style</text>
  <text x="86" y="72.1" class="t-sm">strategies in listed</text>
  <text x="86" y="75.4" class="t-sm">markets; may use leverage.</text>
</svg>
