<svg viewBox="0 0 122 77" role="img" aria-labelledby="health-plate-t">
  <title id="health-plate-t">How a ₹25 lakh hospital bill is paid by a ₹10 lakh base policy and a super top-up, and when cover starts after you buy.</title>

  <text x="0" y="3.4" class="t-bd"><tspan class="b">Example.</tspan> A ₹25 lakh bill, with a ₹10 lakh policy and a super top-up.</text>

  <!-- Row 1: the bill -->
  <text x="0" y="12.6" class="t-cap">The bill</text>
  <rect x="18" y="8.6" width="85" height="6" class="f-ink2"/>
  <text x="20.4" y="12.6" class="t-sm b t-white">Hospital bill ₹25 lakh</text>

  <!-- Row 2: who pays -->
  <text x="0" y="21.6" class="t-cap job">Who pays</text>
  <rect x="18" y="17.6" width="34" height="6" class="f-job"/>
  <text x="20.4" y="21.6" class="t-sm b t-white">Base policy ₹10 lakh</text>
  <rect x="52" y="17.6" width="51" height="6" class="f-deep"/>
  <text x="54.4" y="21.6" class="t-sm b t-white">Super top-up ₹15 lakh</text>
  <text x="105" y="21.6" class="t-sm b">You ₹0</text>

  <!-- Row 3: the cover you hold -->
  <text x="0" y="30.6" class="t-cap job">Your cover</text>
  <rect x="18" y="26.6" width="34" height="6" class="f-tint s-job hair"/>
  <text x="20.4" y="30.6" class="t-sm t-job">Base ₹10 lakh</text>
  <path d="M52,26.6 H118.6 L121.6,29.6 L118.6,32.6 H52 Z" class="f-tint s-job hair"/>
  <text x="54.4" y="30.6" class="t-sm t-job">Super top-up: ₹50 lakh above a ₹10 lakh deductible</text>

  <!-- Axis in ₹ lakh -->
  <line x1="18" y1="35.4" x2="120" y2="35.4" class="s-ink3 hair"/>
  <g class="t-num">
    <line x1="18" y1="34.6" x2="18" y2="36.2" class="s-ink3 hair"/><text x="18" y="38.8" class="t-sm mid">0</text>
    <line x1="35" y1="34.6" x2="35" y2="36.2" class="s-ink3 hair"/><text x="35" y="38.8" class="t-sm mid">5</text>
    <line x1="52" y1="34.6" x2="52" y2="36.2" class="s-ink3 hair"/><text x="52" y="38.8" class="t-sm mid">10</text>
    <line x1="69" y1="34.6" x2="69" y2="36.2" class="s-ink3 hair"/><text x="69" y="38.8" class="t-sm mid">15</text>
    <line x1="86" y1="34.6" x2="86" y2="36.2" class="s-ink3 hair"/><text x="86" y="38.8" class="t-sm mid">20</text>
    <line x1="103" y1="34.6" x2="103" y2="36.2" class="s-ink3 hair"/><text x="103" y="38.8" class="t-sm mid">25</text>
    <text x="120" y="38.8" class="t-sm end">30 lakh</text>
  </g>
  <text x="0" y="38.8" class="t-cap">₹ lakh</text>
  <text x="0" y="43.6" class="t-sm">A super top-up pays once the year’s bills cross its deductible: a low-cost way to raise your cover.</text>

  <!-- Waiting periods -->
  <line x1="0" y1="47.2" x2="122" y2="47.2" class="s-rule hair"/>
  <text x="0" y="51.2" class="t-cap job">When cover starts, from the day you buy</text>
  <text x="122" y="51.2" class="t-cap end">Not to scale</text>

  <text x="1" y="55.6" class="t-cap">Day 1</text>
  <text x="22" y="55.6" class="t-cap">30 days</text>
  <text x="80" y="55.6" class="t-cap mid">Up to 3 years</text>
  <text x="121" y="55.6" class="t-cap end">5 years</text>

  <rect x="1" y="57.2" width="21" height="4.2" class="f-tint"/>
  <rect x="22" y="57.2" width="58" height="4.2" class="f-job" style="opacity:.5"/>
  <rect x="80" y="57.2" width="41" height="4.2" class="f-job"/>
  <line x1="22" y1="56.6" x2="22" y2="62" class="s-ink thin"/>
  <line x1="80" y1="56.6" x2="80" y2="62" class="s-ink thin"/>
  <line x1="121" y1="56.6" x2="121" y2="62" class="s-ink thin"/>
  <line x1="1" y1="56.6" x2="1" y2="62" class="s-ink thin"/>

  <text x="1" y="65" class="t-sm">Accidents</text><text x="1" y="68.2" class="t-sm">covered</text>
  <text x="22" y="65" class="t-sm">Illnesses</text><text x="22" y="68.2" class="t-sm">covered</text>
  <text x="80" y="65" class="t-sm mid">Pre-existing illnesses and</text><text x="80" y="68.2" class="t-sm mid">listed treatments covered</text>
  <text x="121" y="65" class="t-sm end">Moratorium</text><text x="121" y="68.2" class="t-sm end">begins</text>

  <text x="0" y="74" class="t-sm"><tspan class="b">Moratorium:</tspan> after 5 continuous years, a claim cannot be refused for non-disclosure, except in fraud.</text>
</svg>
