<svg viewBox="0 0 122 84" role="img" aria-labelledby="mf-plate-t">
  <title id="mf-plate-t">Investors buy units of one pool; a fund manager invests the pool in shares, bonds and gold; gains raise the NAV. Below, SEBI's five groups of schemes.</title>
  <defs>
    <marker id="ah-mf" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="3.2" markerHeight="3.2" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 z" class="f-ink2"/>
    </marker>
  </defs>

  <!-- Fund manager -->
  <rect x="37" y="0" width="36" height="8.4" class="f-panel"/>
  <text x="55" y="3.6" class="t-sm b mid">Fund manager (AMC)</text>
  <text x="55" y="6.8" class="t-sm mid">decides what to buy</text>
  <line x1="55" y1="8.4" x2="55" y2="11.4" class="s-ink2 thin"/>

  <!-- Investors -->
  <g class="f-job">
    <circle cx="4.5" cy="18.8" r="1.35"/><path d="M2.2,23.6 C2.2,20.7 6.8,20.7 6.8,23.6 Z"/>
    <circle cx="11" cy="18.8" r="1.35"/><path d="M8.7,23.6 C8.7,20.7 13.3,20.7 13.3,23.6 Z"/>
    <circle cx="17.5" cy="18.8" r="1.35"/><path d="M15.2,23.6 C15.2,20.7 19.8,20.7 19.8,23.6 Z"/>
    <circle cx="4.5" cy="27.8" r="1.35"/><path d="M2.2,32.6 C2.2,29.7 6.8,29.7 6.8,32.6 Z"/>
    <circle cx="11" cy="27.8" r="1.35"/><path d="M8.7,32.6 C8.7,29.7 13.3,29.7 13.3,32.6 Z"/>
    <circle cx="17.5" cy="27.8" r="1.35"/><path d="M15.2,32.6 C15.2,29.7 19.8,29.7 19.8,32.6 Z"/>
  </g>
  <text x="11" y="37.6" class="t-sm mid">You and</text>
  <text x="11" y="40.8" class="t-sm mid">other investors</text>

  <line x1="23.5" y1="26" x2="39.4" y2="26" class="s-ink2 thin" marker-end="url(#ah-mf)"/>
  <text x="31.4" y="23.8" class="t-cap mid">Buy units</text>

  <!-- The pool -->
  <circle cx="55" cy="26" r="14.5" class="f-tint s-job thin"/>
  <text x="55" y="20.4" class="t-cap job mid">The fund</text>
  <text x="55" y="25.4" class="t-md mid">One pool</text>
  <text x="55" y="29" class="t-sm mid">held in trust</text>
  <text x="55" y="32.4" class="t-sm mid">price per unit: NAV</text>

  <line x1="70" y1="26" x2="82.6" y2="26" class="s-ink2 thin" marker-end="url(#ah-mf)"/>
  <text x="76.3" y="23.8" class="t-cap mid">Invests</text>

  <!-- What the pool owns -->
  <rect x="84" y="9" width="38" height="9.6" class="f-panel"/>
  <text x="86.6" y="13.2" class="t-bd b">Shares</text>
  <text x="86.6" y="16.6" class="t-sm">stakes in companies</text>
  <rect x="84" y="20.4" width="38" height="9.6" class="f-panel"/>
  <text x="86.6" y="24.6" class="t-bd b">Bonds</text>
  <text x="86.6" y="28" class="t-sm">loans to governments, firms</text>
  <rect x="84" y="31.8" width="38" height="9.6" class="f-panel"/>
  <text x="86.6" y="36" class="t-bd b">Gold and more</text>
  <text x="86.6" y="39.4" class="t-sm">silver, REITs, InvITs</text>

  <!-- Money comes back -->
  <path d="M103,41.4 V45.6 H11 V43.2" class="f-none s-ink2 thin dash" marker-end="url(#ah-mf)"/>
  <text x="57" y="49.6" class="t-sm mid">Gains and income raise the NAV. Sell your units back at that day’s NAV.</text>

  <text x="0" y="56.2" class="t-cap job">Safeguards</text>
  <text x="21" y="56.2" class="t-sm">SEBI regulates  ·  trustees oversee the AMC  ·  a custodian holds the assets</text>

  <!-- Five groups -->
  <line x1="0" y1="59.6" x2="122" y2="59.6" class="s-rule hair"/>
  <text x="0" y="64" class="t-cap job">Five groups of schemes (SEBI, 2026)</text>

  <rect x="0" y="66.4" width="22.8" height="17.2" class="f-tint"/>
  <text x="2" y="70.8" class="t-bd b">Equity</text>
  <text x="2" y="74.6" class="t-sm" style="font-size:2.25px">Mainly shares.</text>
  <text x="2" y="77.9" class="t-sm" style="font-size:2.25px">Long-term growth.</text>

  <rect x="24.8" y="66.4" width="22.8" height="17.2" class="f-tint"/>
  <text x="26.8" y="70.8" class="t-bd b">Debt</text>
  <text x="26.8" y="74.6" class="t-sm" style="font-size:2.25px">Bonds and</text>
  <text x="26.8" y="77.9" class="t-sm" style="font-size:2.25px">money market.</text>

  <rect x="49.6" y="66.4" width="22.8" height="17.2" class="f-tint"/>
  <text x="51.6" y="70.8" class="t-bd b">Hybrid</text>
  <text x="51.6" y="74.6" class="t-sm" style="font-size:2.25px">A mix of equity,</text>
  <text x="51.6" y="77.9" class="t-sm" style="font-size:2.25px">debt and more.</text>

  <rect x="74.4" y="66.4" width="22.8" height="17.2" class="f-tint"/>
  <text x="76.4" y="70.8" class="t-bd b">Life Cycle</text>
  <text x="76.4" y="74.6" class="t-sm" style="font-size:2.25px">Moves to debt</text>
  <text x="76.4" y="77.9" class="t-sm" style="font-size:2.25px">as a goal nears.</text>
  <text x="76.4" y="81.2" class="t-cap job" style="font-size:1.9px">New in 2026</text>

  <rect x="99.2" y="66.4" width="22.8" height="17.2" class="f-tint"/>
  <text x="101.2" y="70.8" class="t-bd b">Other</text>
  <text x="101.2" y="74.6" class="t-sm" style="font-size:2.25px">Index funds,</text>
  <text x="101.2" y="77.9" class="t-sm" style="font-size:2.25px">ETFs, FoFs.</text>
</svg>
