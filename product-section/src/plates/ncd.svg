<svg viewBox="0 0 122 80" role="img" aria-labelledby="ncd-plate-t">
  <title id="ncd-plate-t">How a 3-year NCD pays you. With regular payouts you receive interest along the way and your money back at maturity. With the cumulative option, interest is added each year and paid with your money at maturity. Below, who is paid first if the company fails.</title>
  <defs>
    <marker id="ah-ncd" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" class="f-ink3"/>
    </marker>
  </defs>

  <text x="0" y="3.4" class="t-bd"><tspan class="b">How you are paid.</tspan> The rate is fixed when you invest and stays the same to maturity.</text>

  <g class="t-cap">
    <text x="44" y="9.6" class="t-cap mid">Today</text>
    <text x="67" y="9.6" class="t-cap mid">Year 1</text>
    <text x="90" y="9.6" class="t-cap mid">Year 2</text>
    <text x="113" y="9.6" class="t-cap mid">Year 3</text>
  </g>

  <!-- Regular payout -->
  <text x="0" y="16.4" class="t-cap job">Regular payout</text>
  <text x="0" y="19.8" class="t-sm">Interest along the way,</text>
  <text x="0" y="23.1" class="t-sm">money back at the end</text>
  <line x1="44" y1="19" x2="113" y2="19" class="s-rule hair"/>
  <circle cx="44" cy="19" r="4.2" class="f-paper s-ink2 thin"/>
  <circle cx="67" cy="19" r="1.5" class="f-job"/>
  <circle cx="90" cy="19" r="1.5" class="f-job"/>
  <circle cx="113" cy="19" r="4.4" class="f-job"/>
  <text x="44" y="28.6" class="t-sm mid">You invest</text>
  <text x="67" y="28.6" class="t-sm mid">Interest</text>
  <text x="90" y="28.6" class="t-sm mid">Interest</text>
  <text x="118.4" y="28.6" class="t-sm end b">Money + interest</text>

  <!-- Cumulative -->
  <text x="0" y="37.4" class="t-cap job">Cumulative</text>
  <text x="0" y="40.8" class="t-sm">Interest added each year,</text>
  <text x="0" y="44.1" class="t-sm">all paid at the end</text>
  <line x1="44" y1="40" x2="113" y2="40" class="s-rule hair"/>
  <circle cx="44" cy="40" r="4.2" class="f-paper s-ink2 thin"/>
  <circle cx="67" cy="40" r="1.5" class="f-paper s-job thin"/>
  <circle cx="90" cy="40" r="1.5" class="f-paper s-job thin"/>
  <circle cx="113" cy="40" r="4.4" class="f-deep"/>
  <text x="44" y="49.8" class="t-sm mid">You invest</text>
  <text x="67" y="49.8" class="t-sm mid">Added</text>
  <text x="90" y="49.8" class="t-sm mid">Added</text>
  <text x="118.4" y="49.8" class="t-sm end b">Money + all interest</text>

  <text x="0" y="54.6" class="t-sm">Regular payouts give you income along the way. Cumulative pays it all at maturity.</text>

  <!-- Who is paid first -->
  <line x1="0" y1="57.8" x2="122" y2="57.8" class="s-rule hair"/>
  <text x="0" y="62" class="t-cap job">If the company fails, who is paid first?</text>

  <rect x="0" y="64.4" width="37" height="10.6" class="f-job"/>
  <text x="2.6" y="68.8" class="t-bd b t-white">1  Secured lenders</text>
  <text x="2.6" y="72.4" class="t-sm t-white">including secured NCDs</text>

  <line x1="38" y1="69.7" x2="41.6" y2="69.7" class="s-ink3 thin" marker-end="url(#ah-ncd)"/>

  <rect x="42.5" y="64.4" width="37" height="10.6" class="f-tint"/>
  <text x="45.1" y="68.8" class="t-bd b">2  Unsecured lenders</text>
  <text x="45.1" y="72.4" class="t-sm">including unsecured NCDs</text>

  <line x1="80.5" y1="69.7" x2="84.1" y2="69.7" class="s-ink3 thin" marker-end="url(#ah-ncd)"/>

  <rect x="85" y="64.4" width="37" height="10.6" class="f-panel"/>
  <text x="87.6" y="68.8" class="t-bd b">3  Shareholders</text>
  <text x="87.6" y="72.4" class="t-sm">paid last, if anything is left</text>

  <text x="0" y="79" class="t-sm t-ink3">Simplified. What you recover depends on the assets and the legal process.</text>
</svg>
