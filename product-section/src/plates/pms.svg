<svg viewBox="0 0 122 75" role="img" aria-labelledby="pms-plate-t">
  <title id="pms-plate-t">In a mutual fund you own units of a shared pool; in a PMS the shares sit in your own demat account and the manager trades there. Below, the three ways to work with a portfolio manager.</title>
  <defs>
    <marker id="ah-pms" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="3.2" markerHeight="3.2" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" class="f-ink2"/>
    </marker>
  </defs>

  <!-- Mutual fund side -->
  <text x="0" y="3" class="t-cap">Mutual fund</text>
  <g class="f-ink3">
    <circle cx="6" cy="8.6" r="1.25"/><path d="M3.9,13 C3.9,10.4 8.1,10.4 8.1,13 Z"/>
    <circle cx="14" cy="8.6" r="1.25"/><path d="M11.9,13 C11.9,10.4 16.1,10.4 16.1,13 Z"/>
    <circle cx="22" cy="8.6" r="1.25"/><path d="M19.9,13 C19.9,10.4 24.1,10.4 24.1,13 Z"/>
    <circle cx="30" cy="8.6" r="1.25"/><path d="M27.9,13 C27.9,10.4 32.1,10.4 32.1,13 Z"/>
    <circle cx="38" cy="8.6" r="1.25"/><path d="M35.9,13 C35.9,10.4 40.1,10.4 40.1,13 Z"/>
  </g>
  <g class="s-rule thin">
    <line x1="6" y1="13.6" x2="17.5" y2="20.4"/><line x1="14" y1="13.6" x2="19.6" y2="19.6"/><line x1="22" y1="13.6" x2="22" y2="19.2"/>
    <line x1="30" y1="13.6" x2="24.4" y2="19.6"/><line x1="38" y1="13.6" x2="26.5" y2="20.4"/>
  </g>
  <circle cx="22" cy="26.6" r="7.4" class="f-panel s-ink3 hair"/>
  <text x="22" y="26.2" class="t-sm b mid">Shared</text>
  <text x="22" y="29.4" class="t-sm b mid">pool</text>
  <text x="0" y="39.6" class="t-sm">You own <tspan class="b">units</tspan> of a shared pool.</text>

  <line x1="61" y1="0" x2="61" y2="41" class="s-rule hair dash"/>

  <!-- PMS side -->
  <text x="65" y="3" class="t-cap job">PMS</text>
  <g class="f-job">
    <circle cx="70" cy="9.4" r="1.35"/><path d="M67.7,14.2 C67.7,11.3 72.3,11.3 72.3,14.2 Z"/>
  </g>
  <text x="70" y="17.6" class="t-sm mid">You</text>
  <line x1="73.4" y1="11.6" x2="79.6" y2="11.6" class="s-ink2 thin" marker-end="url(#ah-pms)"/>
  <text x="76.4" y="10.2" class="t-cap mid" style="font-size:1.9px">Own</text>

  <g class="f-ink3">
    <circle cx="70" cy="25.4" r="1.35"/><path d="M67.7,30.2 C67.7,27.3 72.3,27.3 72.3,30.2 Z"/>
  </g>
  <text x="70" y="33.6" class="t-sm mid">Manager</text>
  <line x1="73.4" y1="27.4" x2="79.6" y2="27.4" class="s-ink2 thin dash" marker-end="url(#ah-pms)"/>
  <text x="76.4" y="26" class="t-cap mid" style="font-size:1.9px">Trades</text>

  <rect x="81" y="5" width="41" height="29" class="f-tint s-job hair"/>
  <text x="83.2" y="9.2" class="t-sm b">Your demat account</text>
  <text x="83.2" y="12.4" class="t-sm">in your name</text>
  <g class="f-paper s-job hair">
    <rect x="83.2" y="14.6" width="11.4" height="5"/><rect x="96" y="14.6" width="11.4" height="5"/><rect x="108.8" y="14.6" width="11.4" height="5"/>
    <rect x="83.2" y="20.8" width="11.4" height="5"/><rect x="96" y="20.8" width="11.4" height="5"/><rect x="108.8" y="20.8" width="11.4" height="5"/>
    <rect x="83.2" y="27" width="11.4" height="5"/><rect x="96" y="27" width="11.4" height="5"/><rect x="108.8" y="27" width="11.4" height="5"/>
  </g>
  <g class="t-sm" style="font-size:2px">
    <text x="88.9" y="17.8" class="t-sm mid" style="font-size:2px">Stock A</text><text x="101.7" y="17.8" class="t-sm mid" style="font-size:2px">Stock B</text><text x="114.5" y="17.8" class="t-sm mid" style="font-size:2px">Stock C</text>
    <text x="88.9" y="24" class="t-sm mid" style="font-size:2px">Stock D</text><text x="101.7" y="24" class="t-sm mid" style="font-size:2px">Stock E</text><text x="114.5" y="24" class="t-sm mid" style="font-size:2px">Stock F</text>
    <text x="88.9" y="30.2" class="t-sm mid" style="font-size:2px">Stock G</text><text x="101.7" y="30.2" class="t-sm mid" style="font-size:2px">Stock H</text><text x="114.5" y="30.2" class="t-sm mid" style="font-size:2px">Bond I</text>
  </g>
  <text x="65" y="39.6" class="t-sm">You own <tspan class="b">the shares themselves.</tspan></text>

  <!-- Who decides -->
  <line x1="0" y1="44.2" x2="122" y2="44.2" class="s-rule hair"/>
  <text x="0" y="48.4" class="t-cap job">Three ways to work with a manager</text>
  <rect x="0" y="50.6" width="40" height="6" class="f-job"/>
  <rect x="41" y="50.6" width="40" height="6" class="f-job" style="opacity:.55"/>
  <rect x="82" y="50.6" width="40" height="6" class="f-tint"/>
  <text x="2.4" y="54.6" class="t-cap t-white">Manager decides</text>
  <text x="119.6" y="54.6" class="t-cap job end">You decide</text>

  <text x="0" y="61.8" class="t-bd b">Discretionary</text>
  <text x="0" y="65.4" class="t-sm">The manager decides and trades</text>
  <text x="0" y="68.7" class="t-sm">for you. The most common type.</text>

  <text x="41" y="61.8" class="t-bd b">Non-discretionary</text>
  <text x="41" y="65.4" class="t-sm">The manager suggests, you approve</text>
  <text x="41" y="68.7" class="t-sm">each trade, the manager executes.</text>

  <text x="82" y="61.8" class="t-bd b">Advisory</text>
  <text x="82" y="65.4" class="t-sm">The manager advises; you decide</text>
  <text x="82" y="68.7" class="t-sm">and place each trade yourself.</text>
</svg>
