  <text x="80.8" y="10.6" class="t-lg t-job" style="font-size:4.4px">₹10 lakh</text>
  <text x="80.8" y="15.6" class="t-sm" style="font-size:2.05px">minimum, per</text><text x="80.8" y="18.4" class="t-sm" style="font-size:2.05px">fund house</text>
  <rect x="101" y="2" width="21" height="20.5" class="f-panel"/><rect x="101" y="2" width="21" height=".8" class="f-job"/>
  <text x="102.8" y="10.6" class="t-lg t-job" style="font-size:4.4px">25%</text>
  <text x="102.8" y="15.6" class="t-sm" style="font-size:2.05px">most of the fund</text><text x="102.8" y="18.4" class="t-sm" style="font-size:2.05px">in short positions</text>
  <rect x="79" y="24.5" width="21" height="20.5" class="f-panel"/><rect x="79" y="24.5" width="21" height=".8" class="f-job"/>
  <text x="80.8" y="33.1" class="t-lg t-job" style="font-size:4.4px">100%</text>
  <text x="80.8" y="38.1" class="t-sm" style="font-size:2.05px">most total exposure:</text><text x="80.8" y="40.9" class="t-sm" style="font-size:2.05px">no borrowing</text>
  <rect x="101" y="24.5" width="21" height="20.5" class="f-panel"/><rect x="101" y="24.5" width="21" height=".8" class="f-job"/>
  <text x="102.8" y="33.1" class="t-lg t-job" style="font-size:4.4px">7</text>
  <text x="102.8" y="38.1" class="t-sm" style="font-size:2.05px">strategies, cautious</text><text x="102.8" y="40.9" class="t-sm" style="font-size:2.05px">to adventurous</text>
  <line x1="0" y1="50.4" x2="122" y2="50.4" class="s-rule" style="stroke-width:.25"/>
  <text x="0" y="54.6" class="t-cap job">What the manager can do</text>
  <rect x="0" y="57" width="39.33" height="22" class="f-tint"/>
  <text x="2" y="61.2" class="t-cap job" style="font-size:1.95px">When markets rise</text>
  <path d="M3 69.6 l5 -1.6 l4 .8 l5 -2.4 l4 .8 l6 -3.4" class="f-none s-job" style="stroke-width:.55;stroke-linejoin:round"/>
  <text x="2" y="74.4" class="t-sm" style="font-size:2.1px">Invest up to 100%, in the</text><text x="2" y="77.3" class="t-sm" style="font-size:2.1px">shares expected to lead</text>
  <rect x="41.33" y="57" width="39.33" height="22" class="f-tint"/>
  <text x="43.33" y="61.2" class="t-cap job" style="font-size:1.95px">When markets go sideways</text>
  <path d="M44.3 67.4 l4 -1.8 l4 1.8 l4 -1.8 l4 1.8 l4 -1.8 l4 1.8" class="f-none s-job" style="stroke-width:.55;stroke-linejoin:round"/>
  <text x="43.33" y="74.4" class="t-sm" style="font-size:2.1px">Earn price gaps (arbitrage)</text><text x="43.33" y="77.3" class="t-sm" style="font-size:2.1px">and income from options</text>
  <rect x="82.67" y="57" width="39.33" height="22" class="f-tint"/>
