  <text x="38" y="27.6" class="t-cap t-white" style="text-anchor:middle;font-size:1.8px">THE BEST</text><text x="38" y="30" class="t-cap t-white" style="text-anchor:middle;font-size:1.8px">OF BOTH</text>
