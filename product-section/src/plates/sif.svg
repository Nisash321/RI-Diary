<svg viewBox="0 0 122 80" role="img" aria-labelledby="sif-plate-t">
  <title id="sif-plate-t">Two overlapping circles: mutual fund rules (SEBI oversight, daily NAV, tax only when you redeem or switch) and PMS and AIF tools (short positions, any asset type, focused ideas). Where they overlap is the SIF. Beside it, four key facts. Below, what the manager can do when markets rise, go sideways or fall.</title>
  <circle cx="24" cy="24" r="22.5" class="f-build-t"/>
  <circle cx="52" cy="24" r="22.5" class="f-special-t"/>
