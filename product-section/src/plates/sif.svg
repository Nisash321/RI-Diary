<svg viewBox="0 0 122 80" role="img" aria-labelledby="sif-plate-t">
  <title id="sif-plate-t">A SIF can move the share of the fund exposed to the stock market from as low as minus 25% to 100%, while an equity mutual fund stays between about 65% and 100%. In falling markets the manager can cut exposure and bet on falls; in sideways markets earn from arbitrage, option premiums and interest; in rising markets raise exposure.</title>

  <!-- Exposure range: SIF vs equity mutual fund -->
  <text x="0" y="2.6" class="t-cap job">How much of the fund moves with the stock market</text>
  <text x="0" y="8" class="t-sm b">SIF</text>
  <rect x="20" y="4.6" width="98" height="4.6" class="f-job"/>
  <text x="21.4" y="7.75" class="t-cap t-white" style="font-size:1.9px">As low as −25%</text>
  <text x="116.6" y="7.75" class="t-cap t-white end" style="font-size:1.9px">Up to 100%</text>
  <text x="0" y="14" class="t-sm b" style="fill:var(--ink-2)">Equity MF</text>
  <rect x="90.56" y="10.6" width="27.44" height="4.6" class="f-ink3"/>
  <text x="104.3" y="13.75" class="t-cap t-white mid" style="font-size:1.9px">65–100%</text>
  <line x1="39.6" y1="3.8" x2="39.6" y2="16.4" class="s-ink dash" style="stroke-width:.3"/>
  <line x1="20" y1="17" x2="118" y2="17" class="s-ink3 hair"/>
  <g class="t-sm" style="font-size:2px">
    <line x1="20" y1="16.4" x2="20" y2="17.6" class="s-ink3 hair"/><text x="20" y="19.8" class="t-sm mid" style="font-size:2px">−25%</text>
    <text x="39.6" y="19.8" class="t-sm mid b" style="font-size:2px">0</text>
    <line x1="59.2" y1="16.4" x2="59.2" y2="17.6" class="s-ink3 hair"/><text x="59.2" y="19.8" class="t-sm mid" style="font-size:2px">25%</text>
    <line x1="78.8" y1="16.4" x2="78.8" y2="17.6" class="s-ink3 hair"/><text x="78.8" y="19.8" class="t-sm mid" style="font-size:2px">50%</text>
    <line x1="98.4" y1="16.4" x2="98.4" y2="17.6" class="s-ink3 hair"/><text x="98.4" y="19.8" class="t-sm mid" style="font-size:2px">75%</text>
    <line x1="118" y1="16.4" x2="118" y2="17.6" class="s-ink3 hair"/><text x="118" y="19.8" class="t-sm mid" style="font-size:2px">100%</text>
  </g>

  <!-- Three markets -->
  <g>
    <rect x="0" y="23" width="39.3" height="12.6" class="f-tint"/>
    <text x="2" y="26.6" class="t-cap job">When markets fall</text>
    <polyline points="2,28.6 6,29.8 9,29.2 13,31.2 16,30.6 20,32.4 23,31.8 27,33.6 30,33.2 37.3,34.2" class="f-none s-job" style="stroke-width:.55;stroke-linejoin:round"/>

    <rect x="41.35" y="23" width="39.3" height="12.6" class="f-tint"/>
    <text x="43.35" y="26.6" class="t-cap job">When markets drift</text>
    <polyline points="43.35,31.4 47,29.6 50.5,32.4 54,30 57.5,32.6 61,29.8 64.5,32.2 68,30.2 71.5,32 78.65,30.8" class="f-none s-job" style="stroke-width:.55;stroke-linejoin:round"/>

    <rect x="82.7" y="23" width="39.3" height="12.6" class="f-tint"/>
    <text x="84.7" y="26.6" class="t-cap job">When markets rise</text>
    <polyline points="84.7,34.2 88.5,33.2 92,33.8 95.5,31.8 99,32.4 102.5,30.4 106,31 109.5,29.4 113,29.8 120,28.6" class="f-none s-job" style="stroke-width:.55;stroke-linejoin:round"/>
  </g>

  <g class="t-sm">
    <rect x="0" y="38.4" width="1.1" height="1.1" class="f-job"/><text x="2.4" y="39.7" class="t-sm">Cut exposure, even below</text><text x="2.4" y="42.9" class="t-sm">zero</text>
    <rect x="0" y="45.8" width="1.1" height="1.1" class="f-job"/><text x="2.4" y="47.1" class="t-sm">Bet on falls with derivatives,</text><text x="2.4" y="50.3" class="t-sm">up to 25% of the fund</text>
    <rect x="0" y="53.2" width="1.1" height="1.1" class="f-job"/><text x="2.4" y="54.5" class="t-sm">Hedge holdings with</text><text x="2.4" y="57.7" class="t-sm">futures and options</text>

    <rect x="41.35" y="38.4" width="1.1" height="1.1" class="f-job"/><text x="43.75" y="39.7" class="t-sm">Earn from price gaps between</text><text x="43.75" y="42.9" class="t-sm">cash and futures (arbitrage)</text>
    <rect x="41.35" y="45.8" width="1.1" height="1.1" class="f-job"/><text x="43.75" y="47.1" class="t-sm">Collect option premiums</text><text x="43.75" y="50.3" class="t-sm">(covered calls)</text>
    <rect x="41.35" y="53.2" width="1.1" height="1.1" class="f-job"/><text x="43.75" y="54.5" class="t-sm">Earn interest on the debt</text><text x="43.75" y="57.7" class="t-sm">portion</text>

    <rect x="82.7" y="38.4" width="1.1" height="1.1" class="f-job"/><text x="85.1" y="39.7" class="t-sm">Raise exposure, up to</text><text x="85.1" y="42.9" class="t-sm">100% of the fund</text>
    <rect x="82.7" y="45.8" width="1.1" height="1.1" class="f-job"/><text x="85.1" y="47.1" class="t-sm">Back the sectors and</text><text x="85.1" y="50.3" class="t-sm">stocks expected to lead</text>
    <rect x="82.7" y="53.2" width="1.1" height="1.1" class="f-job"/><text x="85.1" y="54.5" class="t-sm">Lift hedges and shorts</text><text x="85.1" y="57.7" class="t-sm">to keep the upside</text>
  </g>

  <line x1="0" y1="62" x2="122" y2="62" class="s-rule hair"/>
  <text x="0" y="66.4" class="t-bd"><tspan class="b">The difference: only a SIF can bet on falls.</tspan></text>
  <text x="0" y="69.9" class="t-sm">An equity mutual fund must stay mostly invested. It can hedge, but cannot bet on falls. A SIF can,</text>
  <text x="0" y="73.2" class="t-sm">with up to 25% of the fund, and total exposure of no more than 100% of the fund, so no borrowing.</text>
  <text x="0" y="77.8" class="t-sm t-ink3" style="font-size:2.1px">Range shown for equity long-short strategies; −25% is the floor some funds state. What the rules allow, not a promise of returns.</text>
</svg>
