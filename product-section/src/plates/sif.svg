  <text x="17" y="15.0" class="t-sm b t-job" style="text-anchor:middle;font-size:2.5px">rules</text>
  <text x="17" y="20.2" class="t-sm" style="text-anchor:middle;font-size:2.15px">SEBI oversight</text>
  <text x="17" y="23.4" class="t-sm" style="text-anchor:middle;font-size:2.15px">Daily NAV</text>
  <text x="17" y="26.6" class="t-sm" style="text-anchor:middle;font-size:2.15px">Tax only when</text>
  <text x="17" y="29.4" class="t-sm" style="text-anchor:middle;font-size:2.15px">you redeem</text>
  <text x="17" y="32.2" class="t-sm" style="text-anchor:middle;font-size:2.15px">or switch</text>
  <text x="59" y="12.0" class="t-sm b" style="text-anchor:middle;font-size:2.5px;fill:var(--special-deep)">PMS and AIF</text>
  <text x="59" y="15.0" class="t-sm b" style="text-anchor:middle;font-size:2.5px;fill:var(--special-deep)">tools</text>
  <text x="59" y="20.2" class="t-sm" style="text-anchor:middle;font-size:2.15px;">Short positions,</text>
  <text x="59" y="23.0" class="t-sm" style="text-anchor:middle;font-size:2.15px;">up to 25%</text>
  <text x="59" y="26.2" class="t-sm" style="text-anchor:middle;font-size:2.15px;">Any asset type</text>
  <text x="59" y="29.4" class="t-sm" style="text-anchor:middle;font-size:2.15px;">Focused ideas</text>
