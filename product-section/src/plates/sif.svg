  <path d="M85.7 63.6 l5 1.8 l4 -.8 l5 2.4 l4 -.8 l6 3.4" class="f-none s-job" style="stroke-width:.55;stroke-linejoin:round"/>
  <text x="84.67" y="74.4" class="t-sm" style="font-size:2.1px">Hedge, cut exposure, and</text><text x="84.67" y="77.3" class="t-sm" style="font-size:2.1px">gain from falls, up to 25%</text>
