<svg viewBox="0 0 122 82" role="img" aria-labelledby="term-plate-t">
  <title id="term-plate-t">Illustration for Rohan, 30: ₹1 crore of term cover runs from 30 to 60, the years his family relies on his income. It protects the home loan until it is repaid at 50, the children’s education until about 52, and his income for the household until 60.</title>

  <text x="0" y="3.4" class="t-bd"><tspan class="b">Example.</tspan> Rohan, 30, with young children and a home loan, takes ₹1 crore of cover.</text>

  <!-- the cover -->
  <text x="0" y="10.9" class="t-sm b t-job">His term cover</text>
  <rect x="30.00" y="7.4" width="88.00" height="5" class="f-job"/>
  <text x="32.00" y="10.9" class="t-sm b t-white">₹1 crore of cover</text>
  <text x="116.00" y="10.9" class="t-sm b t-white end">until 60</text>

  <text x="30.00" y="17.4" class="t-cap job">What the cover protects</text>

  <!-- home loan: what is owed shrinks to nothing by 50 -->
  <text x="0" y="22.9" class="t-sm b">Home loan</text>
  <path d="M30.00,19.40 L88.67,23.80 L88.67,24.40 L30.00,24.40 Z" class="f-tint"/>
  <text x="90.27" y="22.9" class="t-sm">repaid by 50</text>

  <!-- children's education -->
  <text x="0" y="29.9" class="t-sm b">Children’s education</text>
  <rect x="30.00" y="26.4" width="64.53" height="5" class="f-tint"/>
  <text x="32.00" y="29.9" class="t-sm">School and college for two children</text>
  <text x="96.13" y="29.9" class="t-sm">by about 52</text>

  <!-- income for the household -->
  <text x="0" y="36.9" class="t-sm b">His income</text>
  <path d="M30.00,33.40 L118.00,36.80 L118.00,38.40 L30.00,38.40 Z" class="f-tint"/>
  <text x="32.00" y="36.9" class="t-sm">What his salary pays for at home, every month</text>

  <!-- axis -->
  <line x1="30.00" y1="42.0" x2="118.00" y2="42.0" class="s-ink thin"/>
  <text x="0" y="46.0" class="t-cap">Age</text>
  <line x1="30.00" y1="42.0" x2="30.00" y2="43.2" class="s-ink3 hair"/><text x="30.00" y="46.0" class="t-sm mid">30</text>
  <line x1="44.67" y1="42.0" x2="44.67" y2="43.2" class="s-ink3 hair"/><text x="44.67" y="46.0" class="t-sm mid">35</text>
  <line x1="59.33" y1="42.0" x2="59.33" y2="43.2" class="s-ink3 hair"/><text x="59.33" y="46.0" class="t-sm mid">40</text>
  <line x1="74.00" y1="42.0" x2="74.00" y2="43.2" class="s-ink3 hair"/><text x="74.00" y="46.0" class="t-sm mid">45</text>
  <line x1="88.67" y1="42.0" x2="88.67" y2="43.2" class="s-ink3 hair"/><text x="88.67" y="46.0" class="t-sm mid">50</text>
  <line x1="103.33" y1="42.0" x2="103.33" y2="43.2" class="s-ink3 hair"/><text x="103.33" y="46.0" class="t-sm mid">55</text>
  <line x1="118.00" y1="42.0" x2="118.00" y2="43.2" class="s-ink3 hair"/><text x="118.00" y="46.0" class="t-sm mid">60</text>
  <text x="0" y="51.2" class="t-sm t-ink3" style="font-size:2.2px">Each need gets smaller as the years pass. The term is chosen to last while the family relies on his income.</text>

  <!-- outcomes -->
  <rect x="0" y="55" width="59" height="27" class="f-tint"/>
  <text x="3" y="59.8" class="t-cap job">If something happens to Rohan</text>
  <text x="3" y="67.6" class="t-xl t-job">₹1 crore</text>
  <text x="3" y="72.8" class="t-sm">goes to his family to clear the home loan,</text>
  <text x="3" y="76.1" class="t-sm">keep the children’s education on track</text>
  <text x="3" y="79.4" class="t-sm">and replace his income.</text>

  <rect x="63" y="55" width="59" height="27" class="f-panel"/>
  <text x="66" y="59.8" class="t-cap">When Rohan turns 60</text>
  <text x="66" y="67.6" class="t-xl" style="fill:var(--ink-2)">Job done</text>
  <text x="66" y="72.8" class="t-sm">The cover ends. The loan is repaid, the</text>
  <text x="66" y="76.1" class="t-sm">children are independent, and paying only</text>
  <text x="66" y="79.4" class="t-sm">for protection kept the premium low.</text>
</svg>
